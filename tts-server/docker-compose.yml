# SA Maps voice server + Caddy (automatic HTTPS).
#   cp .env.example .env   # set TTS_DOMAIN (or let setup-vps.sh do everything)
#   docker compose up -d --build
services:
  tts:
    build: .
    image: sa-maps-tts:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Pinned here so a stray value in .env can't move them off the volume / proxy port.
      PORT: "8787"
      MODEL_DIR: /data/models
      CACHE_DIR: /data/cache
      TRUST_PROXY: "1" # client IP comes from Caddy's X-Forwarded-For
    volumes:
      - tts-data:/data
    # Not published on the host: only Caddy reaches it over the compose network.
    expose:
      - "8787"
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - tts
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TTS_DOMAIN: ${TTS_DOMAIN:?set TTS_DOMAIN in .env (setup-vps.sh does this)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tts-data:
  caddy-data:
  caddy-config:
