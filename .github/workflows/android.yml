name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "web/**"
      - ".github/workflows/android.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Bake neural TTS server URL into web/config.js
        if: ${{ vars.TTS_URL != '' }}
        working-directory: .
        env:
          TTS_URL: ${{ vars.TTS_URL }}
        run: |
          sed -i "s#ttsUrl: ''#ttsUrl: '${TTS_URL}'#" web/config.js
          grep -n "ttsUrl" web/config.js

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sa-maps-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/debug/app-debug.apk "sa-maps-${GITHUB_REF_NAME}-debug.apk"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/sa-maps-${{ github.ref_name }}-debug.apk
          generate_release_notes: true
